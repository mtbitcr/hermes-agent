# Fixed, non-secret settings of the journeys test stack: the business profile.
# Same rules as the default profile; nothing here comes from production.
# No MCP server, connector or platform is set: the profile has no connection of any kind.

kanban:
  dispatch_in_gateway: false

# The admitted base route of this profile, as the model policy lists it, and no fallback.
model:
  provider: anthropic
  default: claude-sonnet-5-5
agent:
  reasoning_effort: high
fallback_providers: []

name: raphael_workspace
version: 1.0.0
description: "Dashboard auth provider — Item 32G-A: a revocable, expiring, audited machine credential for the exact Raphael Workspace read-only Kanban surface (9 fixed GET routes, scope kanban.read, project and board pinned to raphael-workspace). Unlike the drain/recommendations static-secret credentials, tokens are CLI-issued (hermes kanban-workspace-token issue/list/revoke) and stored as a non-secret token id plus a SHA-256 digest under HERMES_HOME; the plaintext bearer secret is written exactly once to an explicit owner-selected path and never logged. Revocation and expiry are enforced fresh on every request — no restart, no cache. Always registers: an empty token registry already denies every request (fail-closed)."
author: NousResearch
kind: backend

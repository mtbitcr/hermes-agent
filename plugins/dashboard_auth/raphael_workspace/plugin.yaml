name: raphael_workspace
version: 1.1.0
description: "Managed, mutually isolated machine credentials for Raphael Workspace, recommendations, Connections, Automations, and Models, plus the trusted Server 2 sandbox dispatch the Claude coding worker uses. Each fixed token family has one least-privilege scope and exact route contour; only token ids, SHA-256 digests, fixed grants, and lifecycle metadata are persisted. Plaintext bearer secrets are written once to explicit owner-only paths and never logged. Revocation and expiry are checked from disk on every request; an empty registry fails closed. The sandbox tool takes no arguments, resolves task/source/image/connection/credential from host-owned state, seeds Credential Vault behind CredentialProxy, and returns only a sanitized receipt."
author: NousResearch
kind: backend
provides_tools:
  - raphael_sandbox_provision
python_dependencies:
  # 0.1.15 is the installed, live-proven SDK and publishes every API the
  # wrapper uses; 0.1.16 is admitted by the same bound but is newer than the
  # repository's 14-day exclude-newer window, so it is not required here.
  - "opensandbox>=0.1.15,<0.2"
